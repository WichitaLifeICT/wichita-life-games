# One-time import: copies the live games.wichitalifeict.com into site/ so the game's code
# lives in this repo. Runs when this file is pushed (or by hand from the Actions tab).
name: Import live site
on:
  push:
    paths: ['.github/workflows/import-site.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the live site
        run: |
          rm -rf site
          wget --mirror --page-requisites --no-parent --no-host-directories \
            --directory-prefix=site --execute robots=off --tries=3 \
            https://games.wichitalifeict.com/ || true
          # Common files a page may not link to directly.
          for f in robots.txt favicon.ico favicon.svg manifest.json site.webmanifest _redirects _headers; do
            wget -q -O "site/$f" "https://games.wichitalifeict.com/$f" || rm -f "site/$f"
          done
          find site -type f | sort
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site
          git commit -m "Import the live games site" || echo "nothing new"
          git push
